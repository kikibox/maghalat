name: City link prevention regression tests
on:
  push:
    paths:
      - 'automation/article_link_policy.py'
      - 'automation/city_content_queue.py'
      - 'automation/reviewed_publish_city_queue.py'
      - 'tests/test_city_link_prevention.py'
      - '.github/workflows/city-link-policy-tests.yml'
  pull_request:
    paths:
      - 'automation/article_link_policy.py'
      - 'automation/city_content_queue.py'
      - 'automation/reviewed_publish_city_queue.py'
      - 'tests/test_city_link_prevention.py'
      - '.github/workflows/city-link-policy-tests.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow
      - run: |
          python -m unittest discover -s tests -p 'test_city_link_prevention.py'
          python -m py_compile automation/article_link_policy.py automation/city_content_queue.py automation/reviewed_publish_city_queue.py